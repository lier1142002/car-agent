# AutoSalesAgent 开发环境 — Docker Desktop for Windows
# 启动: docker compose up -d
# 停止: docker compose down
#
# 外部容器 (已存在, 不在本 compose 中管理):
#   docker run -d --name my-redis -p 6379:6379 redis:7-alpine redis-server --appendonly yes
#   docker run -d --name my-rabbitmq1 -p 5672:5672 -p 15672:15672 rabbitmq:3-management-alpine
#   docker run -d --name milvus-standalone ... (已有 milvus + etcd + minio 组合)
#
# 连接配置 (config.py / .env):
#   REDIS_URL=redis://localhost:6379/0
#   RABBITMQ_URL=amqp://guest:guest@localhost:5672/
#   milvus_uri=http://localhost:19530

services:
  # etcd + minio + milvus 作为组合管理, 若已通过 milvus-standalone 启动则可跳过
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agent_etcd
    profiles: [milvus]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: agent_minio
    profiles: [milvus]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: agent_milvus
    profiles: [milvus]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  milvus_data:
